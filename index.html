<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Todo List</title>
</head>

<body>
    <div class="layout">
        <main class="layout_main">
            <h1 class="main_tittle">Las Tareas de Emilio</h1>
            <form class="main_form">
                <input type="text" class="form_input" placeholder="¿Qué tienes que hacer hoy?">

                <ul class="form_list">
                    <li class="list_item">
                        <div class="list_task">
                            <input type="checkbox" class="task_check" />
                            <p class="task_text">
                                Tarea de prueba 1
                            </p>
                        </div>
                        <i class="bi bi-trash list_delete"></i>
                    </li>
                    <li class="list_item">
                        <div class="list_task">
                            <input type="checkbox" class="task_check" />
                            <p class="task_text">
                                Tarea de prueba 2
                            </p>
                        </div>
                        <i class="bi bi-trash list_delete"></i>
                    </li>
                    <li class="list_item">
                        <div class="list_task">
                            <input type="checkbox" class="task_check" />
                            <p class="task_text">
                                Tarea de prueba 3
                            </p>
                        </div>
                        <i class="bi bi-trash list_delete"></i>
                    </li>
                    <li class="list_item">
                        <div class="list_task">
                            <input type="checkbox" class="task_check" />
                            <p class="task_text">
                                Tarea de prueba 4
                            </p>
                        </div>
                        <i class="bi bi-trash list_delete"></i>
                    </li>
                </ul>
            </form>
        </main>
    </div>
</body>

</html>
