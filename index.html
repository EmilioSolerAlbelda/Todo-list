<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Todo List</title>
</head>

<body>
    <div class="layout">
        <main class="layout_main">
            <h1 class="main_tittle">Todo List</h1>
            <p class="main_instructions">Escribe tu tarea y presiona la tecla Enter para añadirla. Haz clic en el
                círculo para marcarla como completada o en la papelera para eliminarla.</p>

            <form id="todo-form" class="main_form">
                <input type="text" id="todo-input" class="form_input" placeholder="¿Qué tienes que hacer hoy?"
                    autocomplete="off" required>
            </form>

            <ul id="todo-list" class="form_list"></ul>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
